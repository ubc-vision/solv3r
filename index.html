<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="SOLV3R research project. Paper and project materials coming soon.">
    <title>SOLV3R</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; color: #192b3a; background: #f6f7f9; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 32px 24px; }
      main { width: min(100%, 760px); padding: 64px 0; border-top: 3px solid #2855ca; }
      .label { color: #2855ca; font-size: .8rem; font-weight: 650; letter-spacing: .16em; text-transform: uppercase; }
      h1 { margin: 24px 0; font-size: clamp(3.5rem, 12vw, 6.5rem); line-height: 1; letter-spacing: -.06em; }
      p { max-width: 44ch; font-size: 1.15rem; line-height: 1.7; color: #566574; }
      a { display: inline-block; margin-top: 24px; padding: 13px 22px; border-radius: 6px; color: white; background: #2855ca; font-weight: 600; text-decoration: none; }
      a:hover { background: #1b3f9d; }
      a:focus-visible { outline: 3px solid #192b3a; outline-offset: 5px; }
    </style>
  </head>
  <body>
    <main>
      <div class="label">Research project</div>
      <h1>SOLV3R</h1>
      <p>Paper and project materials coming soon.</p>
      <a href="https://github.com/ubc-vision/solv3r">View on GitHub &rarr;</a>
    </main>
  </body>
</html>
